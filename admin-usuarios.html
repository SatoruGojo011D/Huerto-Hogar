<!DOCTYPE html>
<!-- Administración de usuarios: lista, crea, edita y elimina cuentas. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Panel Admin - Usuarios</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- CABECERA -->
    <!-- Cabecera administrativa: accesos al sitio y al panel de usuarios. -->
    <header>
        <a href="admin-dashboard.html" class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
            <h1 class="serif">HuertoHogar</h1>
        </a>

        <nav>
            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-usuarios.html" class="active">Usuarios</a></li>
                <li><a href="admin-productos.html">Productos</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <!-- Contenido principal: listado de usuarios y acceso a su edición. -->
    <main class="container" style="max-width: 900px; margin-top: 4rem;">
        <div class="summary-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h2 class="serif" style="font-size: 1.8rem; margin: 0;">Administración de Usuarios</h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">Gestiona las cuentas registradas en la plataforma.</p>
                </div>
                
                <!-- BOTONES DE NAVEGACIÓN Y ACCIÓN -->
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <a href="admin-nuevo-usuario.html" class="btn-checkout" style="text-decoration: none; padding: 0.6rem 1.2rem; font-size: 0.85rem; width: auto;">+ Crear Usuario</a>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid #eee; color: var(--text-muted);">
                            <th style="padding: 0.8rem;">ID</th>
                            <th style="padding: 0.8rem;">Nombre</th>
                            <th style="padding: 0.8rem;">Correo</th>
                            <th style="padding: 0.8rem;">Rol</th>
                            <th style="padding: 0.8rem; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-usuarios">
                        <!-- Carga dinámica vía JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <!-- Pie de página: identificación del panel de gestión. -->
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <a href="index.html" class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
                    <h1 class="serif" style="font-size: 1.2rem;">HuertoHogar</h1>
                </a>
                <p>Panel interno de gestión.</p>
            </div>
        </div>
    </footer>

    <script src="js/inicializacion.js"></script>
    <script src="js/administracion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
