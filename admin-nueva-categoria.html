<!DOCTYPE html>
<!-- Formulario administrativo para crear una categoría nueva. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría - HuertoHogar</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-leaf"></i> Huerto Hogar</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                <a href="admin-dashboard.html#productos" class="nav-item"><i class="fas fa-box"></i><span>Productos</span></a>
                <a href="admin-dashboard.html#usuarios" class="nav-item"><i class="fas fa-users"></i><span>Usuarios</span></a>
                <a href="admin-categorias.html" class="nav-item active"><i class="fas fa-tags"></i><span>Categorías</span></a>
                <a href="admin-dashboard.html#boletas" class="nav-item"><i class="fas fa-receipt"></i><span>Boletas</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Agregar Categoría</h1>
                <div class="user-info"><span>Admin</span><i class="fas fa-user-circle"></i></div>
            </header>

            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-plus"></i> Nueva categoría</h2>
                    </div>
                    <div class="card-body">
                        <form id="form-categoria" class="form">
                            <div class="form-group">
                                <label for="categoria-nombre">Nombre de la categoría</label>
                                <input type="text" id="categoria-nombre" name="categoria-nombre" placeholder="Ej: Frutas Frescas" required>
                            </div>
                            <div class="form-group">
                                <label for="categoria-slug">Slug</label>
                                <input type="text" id="categoria-slug" name="categoria-slug" readonly>
                            </div>
                            <div id="mensaje-categoria" class="form-message"></div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar categoría</button>
                                <a href="admin-categorias.html" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/inicializacion.js"></script>
    <script src="js/administracion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
