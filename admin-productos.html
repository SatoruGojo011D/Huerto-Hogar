<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Huerto Hogar</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-leaf"></i> Huerto Hogar</h2></div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                <a href="admin-productos.html" class="nav-item active"><i class="fas fa-box"></i><span>Productos</span></a>
                <a href="admin-usuarios.html" class="nav-item"><i class="fas fa-users"></i><span>Usuarios</span></a>
                <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Volver al Sitio</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Catálogo de Productos</h1>
                <div class="user-info"><span>Admin</span><i class="fas fa-user-circle"></i></div>
            </header>

            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-list"></i> Lista de Productos</h2>
                        <a href="admin-nuevo-producto.html" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Producto</a>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Precio (CLP)</th>
                                    <th>Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><img src="img/producto1.jpg" alt="Tomates" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                                    <td>Tomates Orgánicos</td>
                                    <td>Verduras</td>
                                    <td>$2.500</td>
                                    <td>25 kg</td>
                                    <td>
                                        <a href="admin-editar-producto.html?id=1" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
                                        <button class="btn-action btn-delete"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                                <tr>
                                    <td><img src="img/producto2.jpg" alt="Lechuga" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                                    <td>Lechuga Hidropónica</td>
                                    <td>Verduras</td>
                                    <td>$1.200</td>
                                    <td>50 unidades</td>
                                    <td>
                                        <a href="admin-editar-producto.html?id=2" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
                                        <button class="btn-action btn-delete"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
