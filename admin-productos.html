<!DOCTYPE html>
<!-- Administración de productos: lista y permite gestionar el inventario. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Panel Admin - Productos</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset-.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- CABECERA -->
    <!-- Cabecera administrativa: navegación de usuarios y productos. -->
    <header>
        <a href="index.html" class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
            <h1 class="serif">HuertoHogar</h1>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="admin-usuarios.html">Usuarios</a></li>
                <li><a href="admin-productos.html" class="active">Productos</a></li>
            </ul>
        </nav>

        <a href="carrito.html" class="cart-icon-wrapper">
            🛒 <span class="cart-badge" id="cart-counter">0</span>
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <!-- Contenido principal: inventario, creación y edición de productos. -->
    <main class="container products-admin">
        <div class="summary-box">
            <div class="products-toolbar">
                <div>
                    <h2 class="serif">Administración de Productos</h2>
                    <p>Gestiona el catálogo e inventario de la tienda.</p>
                </div>
                <div class="products-actions">
                    <a href="admin-nuevo-producto.html" class="btn btn-primary"><i class="fas fa-plus"></i> Agregar producto</a>
                </div>
            </div>

            <div class="admin-table-wrap">
                <!-- Tabla dinámica: admin.js dibuja filas y conecta sus acciones. -->
                <table class="admin-products-table">
                    <thead>
                        <tr style="border-bottom: 2px solid #eee; color: var(--text-muted);">
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-productos">
                        <!-- Carga dinámica vía JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <!-- Pie de página: identificación del panel interno. -->
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <a href="index.html" class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
                    <h1 class="serif" style="font-size: 1.2rem;">HuertoHogar</h1>
                </a>
                <p>Panel interno de gestión.</p>
            </div>
        </div>
    </footer>

    <script src="js/core.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
