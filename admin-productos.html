<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar | Panel Admin - Productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header>
        <a href="index.html" class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
            <h1 class="serif">HuertoHogar</h1>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="admin-usuarios.html">Usuarios</a></li>
                <li><a href="admin-productos.html" class="active">Productos</a></li>
            </ul>
        </nav>

        <a href="carrito.html" class="cart-icon-wrapper">
            🛒 <span class="cart-badge" id="cart-counter">0</span>
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container" style="max-width: 900px; margin-top: 4rem;">
        <div class="summary-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h2 class="serif" style="font-size: 1.8rem; margin: 0;">Administración de Productos</h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">Gestiona el catálogo e inventario de la tienda.</p>
                </div>
                
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <a href="admin-usuarios.html" class="btn-checkout" style="text-decoration: none; padding: 0.6rem 1.2rem; font-size: 0.85rem; width: auto; background-color: #555;">Ir a Usuarios</a>
                    <a href="admin-nuevo-producto.html" class="btn-checkout" style="text-decoration: none; padding: 0.6rem 1.2rem; font-size: 0.85rem; width: auto;">+ Crear Producto</a>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid #eee; color: var(--text-muted);">
                            <th style="padding: 0.8rem;">Imagen</th>
                            <th style="padding: 0.8rem;">Nombre</th>
                            <th style="padding: 0.8rem;">Categoría</th>
                            <th style="padding: 0.8rem;">Precio</th>
                            <th style="padding: 0.8rem;">Stock</th>
                            <th style="padding: 0.8rem; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-productos">
                        <!-- Carga dinámica vía JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <a href="index.html" class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.97-4.03 9-9 9z"/><path d="M11 20v-5"/></svg>
                    <h1 class="serif" style="font-size: 1.2rem;">HuertoHogar</h1>
                </a>
                <p>Panel interno de gestión.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
