<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar | Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo"><h1>Huerto Hogar</h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html" style="color: var(--primary-color);">Contacto</a></li>
                <li><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
        <div class="cart-icon">🛒 <span id="cart-counter">0</span></div>
    </header>

    <main>
        <section class="contenedor-formulario" style="max-width: 600px;">
            <div class="info-contacto">
                <h2>Hablemos</h2>
                <p>¿Tienes dudas sobre tu pedido o nuestros productos? Escríbenos.</p>
            </div>

            <form id="form-contacto">
                <div class="form-group">
                    <label for="nombre-contacto">Nombre Completo:</label>
                    <input type="text" id="nombre-contacto" required>
                </div>
                
                <div class="form-group">
                    <label for="email-contacto">Correo Electrónico:</label>
                    <input type="email" id="email-contacto" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" required>
                        <option value="">Selecciona un asunto</option>
                        <option value="pedidos">Consulta sobre Pedidos</option>
                        <option value="productos">Dudas de Productos</option>
                        <option value="reclamos">Reclamos y Sugerencias</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" rows="5" style="padding: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-family: inherit;" required></textarea>
                </div>

                <button type="submit" class="btn btn-block">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Huerto Hogar - Proyecto Desarrollo Fullstack II</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
