<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto | Panel Admin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="admin-container">
        
        <aside class="admin-sidebar">
            <h2>Panel Admin</h2>
            <ul class="admin-menu">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="admin-productos.html" class="activo">Gestión Productos</a></li>
                <li><a href="#">Gestión Usuarios</a></li>
                <li><a href="#">Órdenes / Pedidos</a></li>
                <li><a href="index.html" style="margin-top: 2rem; background: #e74c3c;">Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h2>Editar Producto</h2>
                <a href="admin-productos.html" class="btn btn-small" style="background-color: #666; color: white;">Volver al Listado</a>
            </div>

            <section class="contenedor-formulario" style="margin: 0; max-width: 600px;">
                <form id="form-producto-editar">
                    
                    <div class="form-group">
                        <label for="codigo-prod-ed">Código del Producto:</label>
                        <input type="text" id="codigo-prod-ed" value="PROD-001" disabled title="El código no se puede modificar">
                    </div>

                    <div class="form-group">
                        <label for="nombre-prod-ed">Nombre:</label>
                        <input type="text" id="nombre-prod-ed" value="Manzanas Orgánicas" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria-prod-ed">Categoría:</label>
                        <select id="categoria-prod-ed" required>
                            <option value="frutas" selected>Frutas</option>
                            <option value="verduras">Verduras</option>
                            <option value="lacteos">Lácteos y Huevos</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <div class="form-group" style="flex: 1;">
                            <label for="precio-prod-ed">Precio ($):</label>
                            <input type="number" id="precio-prod-ed" value="2500" required>
                            <small id="error-precio-ed">El precio no puede ser negativo.</small>
                        </div>

                        <div class="form-group" style="flex: 1;">
                            <label for="stock-prod-ed">Stock (Unidades/Kg):</label>
                            <input type="number" id="stock-prod-ed" value="45" required>
                            <small id="error-stock-ed">El stock no puede ser negativo.</small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-block">Actualizar Producto</button>
                </form>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
