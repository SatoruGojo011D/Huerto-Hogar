<!DOCTYPE html>
<!-- Formulario administrativo para registrar un producto en el catálogo. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Huerto Hogar</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-leaf"></i> Huerto Hogar</h2></div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                <a href="admin-productos.html" class="nav-item active"><i class="fas fa-box"></i><span>Productos</span></a>
                <a href="admin-usuarios.html" class="nav-item"><i class="fas fa-users"></i><span>Usuarios</span></a>
                <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Volver al Sitio</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Agregar Nuevo Producto</h1>
                <div class="user-info"><span>Admin</span><i class="fas fa-user-circle"></i></div>
            </header>

            <div class="content">
                <div class="card">
                    <div class="card-header"><h2><i class="fas fa-seedling"></i> Detalles del Producto</h2></div>
                    <div class="card-body">
                        <form id="formNuevoProducto" class="form">
                            <div class="form-group">
                                <label for="nuevo-prod-nombre">Nombre del Producto *</label>
                                <input type="text" id="nuevo-prod-nombre" name="nuevo-prod-nombre" required placeholder="Ej: Tomates Cherry">
                            </div>
                            <div class="form-group">
                                <label for="nuevo-prod-categoria">Categoría *</label>
                                <select id="nuevo-prod-categoria" name="nuevo-prod-categoria" required>
                                    <option value="Verduras">Verduras</option>
                                    <option value="Frutas">Frutas</option>
                                    <option value="Herramientas">Herramientas</option>
                                    <option value="Semillas">Semillas</option>
                                </select>
                            </div>
                            <div class="form-row" style="display: flex; gap: 1rem;">
                                <div class="form-group" style="flex: 1;">
                                    <label for="nuevo-prod-precio">Precio (CLP) *</label>
                                    <input type="number" id="nuevo-prod-precio" name="nuevo-prod-precio" required placeholder="0">
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label for="nuevo-prod-stock">Stock Inicial *</label>
                                    <input type="number" id="nuevo-prod-stock" name="nuevo-prod-stock" required placeholder="0">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="nuevo-prod-imagen">Ruta o URL de Imagen</label>
                                <input type="text" id="nuevo-prod-imagen" name="nuevo-prod-imagen" placeholder="img/producto1.jpg">
                            </div>
                            <div id="mensaje-error-nuevo-prod" style="margin-bottom: 1rem; font-weight: bold; color: #d32f2f;"></div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Producto</button>
                                <a href="admin-productos.html" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/core.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
