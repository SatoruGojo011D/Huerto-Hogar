<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header>
        <div class="logo">
            <h1>Huerto Hogar</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="contenedor-formulario">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                
                <div class="form-group">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" placeholder="ejemplo@duoc.cl" required>
                    <small id="error-login-email">Correo no válido.</small>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="Ingresa tu contraseña" required>
                    <small id="error-login-password">La contraseña es incorrecta.</small>
                </div>

                <button type="submit" class="btn btn-block">Ingresar</button>

                <p class="enlace-form">
                    ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>&copy; 2026 Huerto Hogar - Proyecto Desarrollo Fullstack II</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
