<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Huerto Hogar</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-leaf"></i> Huerto Hogar</h2></div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                <a href="admin-productos.html" class="nav-item"><i class="fas fa-box"></i><span>Productos</span></a>
                <a href="admin-usuarios.html" class="nav-item active"><i class="fas fa-users"></i><span>Usuarios</span></a>
                <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Volver al Sitio</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Editar Perfil de Usuario</h1>
                <div class="user-info"><span>Admin</span><i class="fas fa-user-circle"></i></div>
            </header>

            <div class="content">
                <div class="card">
                    <div class="card-header"><h2><i class="fas fa-user-cog"></i> Datos de la Cuenta</h2></div>
                    <div class="card-body">
                        <form id="formEditarUsuario" class="form">
                            <div class="form-group">
                                <label for="editNombreUser">Nombre Completo *</label>
                                <input type="text" id="editNombreUser" value="Carlos Ruiz" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="editEmailUser">Correo Electrónico *</label>
                                <input type="email" id="editEmailUser" value="carlos@email.com" required>
                            </div>

                            <div class="form-group">
                                <label for="editRolUser">Rol de Usuario *</label>
                                <select id="editRolUser" required>
                                    <option value="cliente" selected>Cliente</option>
                                    <option value="editor">Editor de Contenido</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="estadoUser">Estado de la Cuenta</label>
                                <select id="estadoUser">
                                    <option value="activo" selected>Activo</option>
                                    <option value="inactivo">Inactivo / Bloqueado</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="newPassUser">Nueva Contraseña (Dejar vacío para no cambiar)</label>
                                <input type="password" id="newPassUser" placeholder="••••••••">
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Cambios</button>
                                <a href="admin-usuarios.html" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
